name: Deploy para Produção

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build, Validar e Publicar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Executar testes
        run: npm run test

      - name: Disparar deploy no Render
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -s -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            && echo "Deploy disparado com sucesso." \
            || echo "Deploy Hook nao configurado ou falhou."
        continue-on-error: true
