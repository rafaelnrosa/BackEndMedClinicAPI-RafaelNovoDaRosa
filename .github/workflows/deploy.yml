name: Deploy para Producao

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build, Validar e Publicar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Executar testes
        run: npm run test

      - name: Disparar deploy no Render
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl -s -X POST "$DEPLOY_HOOK"
            echo "Deploy disparado."
          else
            echo "RENDER_DEPLOY_HOOK_URL nao configurado, pulando."
          fi
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
