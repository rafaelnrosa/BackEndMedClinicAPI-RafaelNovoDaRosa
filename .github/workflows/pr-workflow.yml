name: Validação do Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Build e Cobertura de Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Testes com cobertura (mínimo 80%)
        run: npm run test:cov
